name: vlm-prak
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5001:5001"
      - "5678:5678"
    volumes:
      - ./backend:/app
    environment:
      REMOTE_DEBUG: true
      APP_ENV: development
      LOG_LEVEL: INFO
      PYTHONUNBUFFERED: 1
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:5001
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  huggingface-cache:
  qwen-offload:
